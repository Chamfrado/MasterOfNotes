# Release (T-009-03, SPEC-009): builds the Master Of Notes NSIS installer + updater latest.json
# and uploads them to a DRAFT GitHub release. Never publishes; publishing is a manual owner action (R6).
#
# State (2026-11-19): repo secrets TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD exist
# (owner); the public key goes in tauri.conf.json `plugins.updater.pubkey` (Agent 1). Pushing a v* tag or
# running this workflow is still the owner's decision. Without the secrets, "Check signing secrets" fails
# with an explicit message.
# Release-only settings live in .github/tauri-release.conf.json, so local `tauri build`, `cargo test` and the
# CI never need them: updater artifacts (.sig + latest.json, needs the private key) and the bundled
# onnxruntime.dll + THIRD-PARTY-NOTICES.txt (SPEC-012 "Decisões de runtime"; resource paths are relative to
# apps/desktop/src-tauri). The DLL is fetched by "Fetch ONNX Runtime" below and never committed.
# A config FILE instead of inline JSON: on Windows the runner (`pnpm`, a .cmd shim) goes through cmd.exe,
# where inline JSON quoting is fragile.

name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Least privilege (T-014-01): nothing at workflow level; the job below gets contents: write (draft release).
permissions: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  draft:
    runs-on: windows-latest
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    # The updater signing key is NOT in the job env: only the two steps that need it get it
    # (T-014-01). Third-party actions are pinned to commit SHAs; the checkout keeps no token.
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Check signing secrets
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "::error::Secret TAURI_SIGNING_PRIVATE_KEY missing — owner action required (see top of release.yml, SPEC-009)."
            exit 1
          fi

      # R1: the tag must match the version in tauri.conf.json.
      - name: Check tag matches app version
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} != v${version} (tauri.conf.json)"
            exit 1
          fi

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master; toolchain from the input
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2

      # SPEC-012: official Microsoft onnxruntime.dll (NuGet, MIT), checked against a pinned SHA-256.
      # Any failure (download or hash) fails the release: never ship an unverified DLL.
      - name: Fetch ONNX Runtime
        run: node apps/desktop/src-tauri/scripts/fetch-onnxruntime.mjs

      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          # Relative to projectPath (apps/desktop), as the Tauri CLI and tauri-action both resolve it.
          args: --bundles nsis --config ../../.github/tauri-release.conf.json
          tagName: v__VERSION__
          releaseName: Master Of Notes v__VERSION__
          releaseBody: Rascunho gerado pelo CI. Revise as notas antes de publicar.
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
