name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 9 * * 1" # weekly: new RustSec advisories show up without a push (deny job only)

# Actions pinned to full commit SHAs (tag in the comment): a moved tag cannot change what runs (T-014-01).
permissions:
  contents: read

concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }} # the weekly run never cancels a push run
  cancel-in-progress: true

jobs:
  # deny.toml: RustSec advisories and allowed licenses of the shipped (Windows) graph.
  deny:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1 (cargo-deny 0.20.2)
        with:
          command: check advisories licenses

  check:
    if: github.event_name != 'schedule'
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      # Law 03: no fake scoring. Math.random is forbidden in scoring code outside tests.
      - name: Law 03 — no Math.random in scoring code
        run: |
          if git grep -n "Math\.random" -- \
              ':(glob)apps/desktop/src/**/scor*' \
              ':(glob)apps/desktop/src/**/scor*/**' \
              ':(exclude,glob)**/*.test.*'; then
            echo "::error::Math.random in scoring code (Law 03, docs/project-laws.md)"
            exit 1
          fi

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4 (pnpm version from package.json "packageManager")
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter desktop typecheck
      - run: pnpm --filter desktop test
      - name: E2E (Playwright, Vite + test-only IPC mock)
        working-directory: apps/desktop
        run: |
          pnpm exec tsc -p e2e/tsconfig.json
          pnpm exec playwright install --only-shell chromium
          pnpm exec playwright test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with:
          name: playwright-traces
          path: apps/desktop/test-results/
          retention-days: 7
      # tauri::generate_context! needs frontendDist (../dist) to exist at compile time.
      - run: pnpm --filter desktop build

      - uses: dtolnay/rust-toolchain@df2a88e9fe4098bad09cb42c3dec7187f15861fc # master; toolchain from the input
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
