[workspace]
resolver = "3"
members = ["apps/desktop/src-tauri", "crates/*"]

[workspace.package]
edition = "2024"
version = "0.1.7"
license = "LicenseRef-Proprietary"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# DSP must stay fast in debug builds too (tests, `tauri dev`).
[profile.dev.package.audio-engine]
opt-level = 3
[profile.dev.package.scoring-engine]
opt-level = 3
[profile.dev.package.song-analysis]
opt-level = 3

# Disk budget: full debuginfo (.pdb) dominates target/ size on Windows.
[profile.dev]
debug = "line-tables-only"
[profile.dev.package."*"]
debug = false
